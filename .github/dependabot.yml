version: 2

# Dependabot keeps GitHub Actions and Gradle dependencies up to date so we
# don't accumulate CVE drift like the Glance 1.1.0 → 1.1.1 catch-up that
# triggered P8.4. Weekly cadence to avoid PR noise; PRs land on Monday
# morning local time.
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions

  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - gradle
    # Group related libraries so Dependabot doesn't open one PR per Compose
    # artifact each release. Single PR per group is much easier to merge.
    groups:
      androidx-compose:
        patterns:
          - "androidx.compose*"
      androidx-room:
        patterns:
          - "androidx.room*"
      androidx-lifecycle:
        patterns:
          - "androidx.lifecycle*"
      kotlinx:
        patterns:
          - "org.jetbrains.kotlinx*"
      ktor:
        patterns:
          - "io.ktor*"
    # KSP version is suffixed by the Kotlin version (`<kotlin>-<ksp>`). It
    # must move in lockstep with Kotlin — bumping KSP independently breaks
    # the build with "KSP plugin requires Kotlin X". Dependabot doesn't
    # understand this coupling, so PRs like #366 / #369 keep appearing for
    # KSP 2.3.x while Kotlin is still 2.0.21. Ignore standalone KSP bumps;
    # we'll roll it together with Kotlin in the next major upgrade wave.
    ignore:
      - dependency-name: "com.google.devtools.ksp"
      - dependency-name: "com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin"
