version: 2

# Dependabot keeps GitHub Actions and Gradle dependencies up to date so we
# don't accumulate CVE drift like the Glance 1.1.0 → 1.1.1 catch-up that
# triggered P8.4. Weekly cadence to avoid PR noise; PRs land on Monday
# morning local time.
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions

  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - gradle
    # Group related libraries so Dependabot doesn't open one PR per Compose
    # artifact each release. Single PR per group is much easier to merge.
    groups:
      androidx-compose:
        patterns:
          - "androidx.compose*"
      androidx-room:
        patterns:
          - "androidx.room*"
      androidx-lifecycle:
        patterns:
          - "androidx.lifecycle*"
      kotlinx:
        patterns:
          - "org.jetbrains.kotlinx*"
      ktor:
        patterns:
          - "io.ktor*"
    # The next major upgrade wave (Kotlin 2.0.21 → 2.3+, AGP 8.10.1 → 9.x)
    # also drags KSP / Room / Ktor / kotlinx along. Ignoring these as
    # standalone bumps prevents the dependabot weekly cycle from
    # re-opening PRs that we already proved (locally + #366 / #369 / #370 /
    # #371 / #372) require the larger upgrade. Patches within the current
    # major are still tracked via the `update-types: [version-update:semver-major]`
    # filter — only majors are blocked.
    ignore:
      # KSP locked to Kotlin via `<kotlin>-<ksp>` suffix.
      - dependency-name: "com.google.devtools.ksp"
      - dependency-name: "com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin"
      # Room 2.8.x triggers an internal KSP compiler error against Kotlin
      # 2.0.21 regardless of the kotlinx-serialization version paired with
      # it (verified: 1.7.2 / 1.7.3 / 1.8.0 / 1.11.0 all fail). Stays on 2.6.1
      # until the Kotlin major bump.
      - dependency-name: "androidx.room:*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # Ktor 3.x has substantial API changes (HttpClient init / plugin
      # config / MockEngine). Migration deferred to next wave.
      - dependency-name: "io.ktor:*"
        update-types: ["version-update:semver-major"]
      # kotlinx-serialization 1.8+ and kotlinx-coroutines 1.11+ both ship
      # binaries compiled against Kotlin 2.2 (verified via #373:
      # "Module was compiled with an incompatible version of Kotlin.
      # The binary version of its metadata is 2.2.0, expected version
      # is 2.0.0"). Pin to patch-only within the current minor until
      # the Kotlin major bump.
      - dependency-name: "org.jetbrains.kotlinx:kotlinx-serialization*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "org.jetbrains.kotlinx:kotlinx-coroutines*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
